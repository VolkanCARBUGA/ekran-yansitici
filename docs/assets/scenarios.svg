<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Ekran senaryoları: yalnızca tablet, tablet ve monitör, yalnızca monitör" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5A4"/><stop offset="0.6" stop-color="#2563EB"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="gT"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.38"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gA"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.26"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <symbol id="laptop" overflow="visible">
      <rect x="10" y="0" width="120" height="78" rx="7" fill="#1F2937" stroke="#475569" stroke-width="2"/>
      <rect x="16" y="6" width="108" height="66" rx="3" fill="#05070D"/>
      <g stroke="#FB7185" stroke-width="1.5" fill="none" stroke-linecap="round">
        <path d="M62 38 L50 18 L46 8"/><path d="M62 38 L84 22 L104 12"/><path d="M62 38 L92 46 L122 52"/>
        <path d="M62 38 L66 58 L62 71"/><path d="M62 38 L40 52 L18 62"/><path d="M62 38 L36 32 L18 28"/>
      </g>
      <circle cx="62" cy="38" r="3.5" fill="#FB7185"/>
      <path d="M0 80 H140 L135 92 Q134 94 131 94 H9 Q6 94 5 92 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    </symbol>
    <symbol id="tablet" overflow="visible">
      <rect x="0" y="0" width="110" height="76" rx="10" fill="#0B1220" stroke="currentColor" stroke-width="2.5"/>
      <rect x="7" y="7" width="96" height="62" rx="5" fill="url(#wall)"/>
      <rect x="7" y="7" width="96" height="7" rx="3" fill="#F8FAFC" fill-opacity="0.85"/>
      <rect x="18" y="22" width="52" height="30" rx="4" fill="#0F172A" fill-opacity="0.75"/>
      <rect x="30" y="58" width="50" height="8" rx="4" fill="#F8FAFC" fill-opacity="0.55"/>
    </symbol>
    <symbol id="monitor" overflow="visible">
      <rect x="0" y="0" width="170" height="106" rx="8" fill="#111827" stroke="currentColor" stroke-width="2.5"/>
      <rect x="8" y="8" width="154" height="90" rx="4" fill="url(#wall)"/>
      <rect x="8" y="8" width="154" height="9" rx="3" fill="#F8FAFC" fill-opacity="0.85"/>
      <rect x="26" y="30" width="80" height="44" rx="5" fill="#0F172A" fill-opacity="0.75"/>
      <rect x="50" y="84" width="70" height="10" rx="5" fill="#F8FAFC" fill-opacity="0.55"/>
      <rect x="76" y="106" width="18" height="14" fill="#334155"/>
      <rect x="50" y="119" width="70" height="7" rx="3.5" fill="#334155"/>
    </symbol>
    <symbol id="monitorOff" overflow="visible">
      <rect x="0" y="0" width="170" height="106" rx="8" fill="#111827" stroke="currentColor" stroke-width="2.5"/>
      <rect x="8" y="8" width="154" height="90" rx="4" fill="url(#wall)" opacity="0.55"/>
      <rect x="26" y="30" width="80" height="44" rx="5" fill="#0F172A" fill-opacity="0.75"/>
      <rect x="76" y="106" width="18" height="14" fill="#334155"/>
      <rect x="50" y="119" width="70" height="7" rx="3.5" fill="#334155"/>
    </symbol>
  </defs>

  <g transform="translate(0 0)">
    <rect x="1" y="1" width="398" height="328" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <rect x="24" y="1" width="80" height="4" rx="2" fill="#2DD4BF"/>
    <circle cx="40" cy="44" r="14" fill="#2DD4BF" fill-opacity="0.16"/>
    <text x="40" y="49" text-anchor="middle" font-size="14" font-weight="800" fill="#2DD4BF">1</text>
    <text x="64" y="51" font-size="21" font-weight="800" fill="#F8FAFC">Yalnızca tablet</text>
    <text x="26" y="80" font-size="14" fill="#94A3B8">Tablet USB veya Wi-Fi ile bağlı</text>
    <circle cx="302" cy="212" r="95" fill="url(#gT)"/><use href="#laptop" transform="translate(36 160) scale(1.1)"/><use href="#tablet" transform="translate(242 170) scale(1.05)" style="color:#2DD4BF"/><path d="M188 262 C 214 286, 222 246, 243 236" fill="none" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/><path d="M188 262 C 214 286, 222 246, 243 236" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 7"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="0.8s" repeatCount="indefinite"/></path><rect x="256.1" y="128" width="87.8" height="26" rx="13" fill="#14B8A6"/><path d="M294 154 L300 162 L306 154 Z" fill="#14B8A6"/><text x="300" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#042F2E">Ana ekran</text><text x="113" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#FB7185">kırık ekran</text>
    <line x1="26" y1="282" x2="374" y2="282" stroke="#1E293B" stroke-width="1.5"/>
    <text x="26" y="308" font-size="14" font-weight="600" fill="#CBD5E1">Menü / görev çubuğu tablette</text>
  </g>

  <g transform="translate(440 0)">
    <rect x="1" y="1" width="398" height="328" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <rect x="24" y="1" width="80" height="4" rx="2" fill="#60A5FA"/>
    <circle cx="40" cy="44" r="14" fill="#60A5FA" fill-opacity="0.16"/>
    <text x="40" y="49" text-anchor="middle" font-size="14" font-weight="800" fill="#60A5FA">2</text>
    <text x="64" y="51" font-size="21" font-weight="800" fill="#F8FAFC">Tablet + monitör</text>
    <text x="26" y="80" font-size="14" fill="#94A3B8">Tablet bağlı, monitör takılı</text>
    <circle cx="176" cy="228" r="70" fill="url(#gT)"/><circle cx="308" cy="196" r="85" fill="url(#gA)"/><use href="#laptop" transform="translate(20 188) scale(0.82)"/><use href="#tablet" transform="translate(132 202) scale(0.82)" style="color:#2DD4BF"/><use href="#monitorOff" transform="translate(232 138) scale(0.88)" style="color:#FBBF24"/><path d="M133 264 C 140 278, 128 250, 134 246" fill="none" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/><path d="M133 264 C 140 278, 128 250, 134 246" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 7"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="0.8s" repeatCount="indefinite"/></path><rect x="133.1" y="160" width="87.8" height="26" rx="13" fill="#14B8A6"/><path d="M171 186 L177 194 L183 186 Z" fill="#14B8A6"/><text x="177" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#042F2E">Ana ekran</text><rect x="267.2" y="96" width="79.6" height="26" rx="13" fill="#F59E0B"/><path d="M301 122 L307 130 L313 122 Z" fill="#F59E0B"/><text x="307" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#3B2300">2. ekran</text>
    <line x1="26" y1="282" x2="374" y2="282" stroke="#1E293B" stroke-width="1.5"/>
    <text x="26" y="308" font-size="14" font-weight="600" fill="#CBD5E1">Tablet ana ekran, monitör 2. ekran</text>
  </g>

  <g transform="translate(880 0)">
    <rect x="1" y="1" width="398" height="328" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <rect x="24" y="1" width="80" height="4" rx="2" fill="#FBBF24"/>
    <circle cx="40" cy="44" r="14" fill="#FBBF24" fill-opacity="0.16"/>
    <text x="40" y="49" text-anchor="middle" font-size="14" font-weight="800" fill="#FBBF24">3</text>
    <text x="64" y="51" font-size="21" font-weight="800" fill="#F8FAFC">Yalnızca monitör</text>
    <text x="26" y="80" font-size="14" fill="#94A3B8">Tablet çıkarıldı</text>
    <circle cx="290" cy="196" r="100" fill="url(#gT)"/><use href="#laptop" transform="translate(26 176) scale(0.95)"/><use href="#monitor" transform="translate(204 136) scale(1.0)" style="color:#2DD4BF"/><rect x="245.1" y="96" width="87.8" height="26" rx="13" fill="#14B8A6"/><path d="M283 122 L289 130 L295 122 Z" fill="#14B8A6"/><text x="289" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#042F2E">Ana ekran</text><rect x="50" y="110" width="84" height="56" rx="9" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/><text x="92" y="143" text-anchor="middle" font-size="13" font-weight="600" fill="#64748B">tablet yok</text>
    <line x1="26" y1="282" x2="374" y2="282" stroke="#1E293B" stroke-width="1.5"/>
    <text x="26" y="308" font-size="14" font-weight="600" fill="#CBD5E1">~4 sn içinde ana ekran monitöre geçer</text>
  </g>
</svg>
