<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="USB'yi tak, ekran gelsin. Tableti çıkar, monitör ana ekran olsun. Wi-Fi'da PIN ile güvende." font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
  <!-- Üç slogan sırayla belirip kaybolur (9 sn döngü) -->
  <g fill="#14B8A6" opacity="0">
    <text x="450" y="37">🔌 USB'yi tak, ekran gelsin.</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g fill="#3B82F6" opacity="0">
    <text x="450" y="37">🖥️ Tableti çıkar, monitör ana ekran olsun.</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.61;0.66;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g fill="#F59E0B" opacity="0">
    <text x="450" y="37">🔒 Wi-Fi'da PIN ile güvende.</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.95;1" dur="9s" repeatCount="indefinite"/>
  </g>
</svg>
