<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ekran Yansıtıcı</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css?v=2.5" />
</head>
<body>
  <main id="stage" aria-label="Bilgisayar Ekranı">
    <canvas id="screen"></canvas>
  </main>

  <!-- Bağlantı Katmanı -->
  <div id="overlay" class="overlay" role="status" aria-live="polite">
    <div class="overlay-card">
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <h1 id="overlay-title">Bilgisayara Bağlanılıyor...</h1>
      <p id="overlay-subtitle">Ekran akışı başlatılıyor</p>
      <!-- Wi-Fi PIN girişi (USB bağlantısında gösterilmez) -->
      <form id="pin-form" class="pin-form hidden" autocomplete="off">
        <input id="pin-input" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
               maxlength="12" placeholder="••••••" aria-label="PIN kodu" required />
        <button id="pin-submit" class="btn" type="submit">Bağlan</button>
        <p id="pin-error" class="pin-error" role="alert"></p>
      </form>
      <button id="btn-retry" class="btn hidden" type="button">Tekrar Dene</button>
    </div>
  </div>

  <!-- Sade Alt Köşe Kontrolü: Sadece Tam Ekran / Çık + (Yakınlaştırıldığında) 100% Sıfırla -->
  <div class="controls">
    <button id="btn-pin" class="pill hidden" type="button" title="Wi-Fi PIN'ini göster">🔒</button>
    <button id="btn-zoom-reset" class="pill hidden" type="button" title="Yakınlaştırmayı Sıfırla">100%</button>
    <button id="btn-fullscreen" class="pill" type="button" title="Tam Ekran Yap / Çık">⛶ Tam Ekran</button>
  </div>

  <script src="/app.js?v=2.5"></script>
</body>
</html>
